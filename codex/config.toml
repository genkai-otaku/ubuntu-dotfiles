# Codex CLI の設定（実体は dotfiles の codex/config.toml。~/.codex/config.toml はここへのリンク）。
# グローバル指示は ~/.codex/AGENTS.md（ai/core.md + ai/codex.md の連結。bash ai/install.sh が生成する）。
# フックは ~/.codex/hooks.json（実体は codex/hooks.json）。
#
# model / model_reasoning_effort はユーザーが選ぶ。既存の値をエージェントが変更しない。
# Codex専用スキルは ~/.codex/skills（nix/home.nix で個別リンク）。

approval_policy = "on-request"   # 作業範囲内は自律実行し、範囲外の操作は承認を求める
approvals_reviewer = "auto_review" # 承認が必要な操作は自動レビューへ回す
sandbox_mode = "workspace-write" # 作業ディレクトリの外へは書かない
model_reasoning_effort = "high"
model = "gpt-6.1-sol"

[sandbox_workspace_write]
network_access = true            # gh・nix・パッケージ取得に必要

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_PROSE"

[marketplaces.openai-bundled]
source_type = "local"
source = "/home/peipou/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/home/peipou/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/peipou/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/peipou/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.1007.21434"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/peipou/.codex/plugins/cache/openai-bundled/browser/26.1007.21434/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

[projects."/home/peipou/Dev/hobby/katoline-org/katoline"]
trust_level = "trusted"

[projects."/home/peipou/Dev/kaishi/ubuntu-dotfiles"]
trust_level = "trusted"

