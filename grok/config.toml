[cli]
installer = "internal"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.6"
yolo = false
compact_mode = false
permission_mode = "always-approve"

# 調査は親（grok-4.6）より軽いモデルへ。plan / general-purpose は親を継承
[subagents.models]
explore = "grok-4.5"

# ~/.claude/rules/ は Claude 専用（モデル運用）。共通ルールは CLAUDE.md
[compat.claude]
rules = false

# Codex は使わない
[compat.codex]
sessions = false
